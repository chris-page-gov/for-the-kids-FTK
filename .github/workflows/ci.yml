name: FTK checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.2'
      - name: Select checks
        id: impact
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: uv run --locked --no-dev python scripts/impact.py --base "$BASE" >> "$GITHUB_OUTPUT"
      - name: Static publication and policy checks
        run: |
          uv run --locked --no-dev python -m unittest discover -s tests -v
          uv run --locked --no-dev python scripts/site.py build
          uv run --locked --no-dev python scripts/site.py check
      - name: Install browser for relevant changes
        if: steps.impact.outputs.browser == 'true'
        run: |
          uv sync --locked
          uv run --locked playwright install --with-deps chromium
      - name: Exercise actual browser journeys
        if: steps.impact.outputs.browser == 'true'
        run: uv run --locked python scripts/browser_check.py
      - name: Retain browser receipts
        if: always() && steps.impact.outputs.browser == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-receipts
          path: output/
          retention-days: 30
  ftk-ci:
    if: always()
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation
        env:
          RESULT: ${{ needs.validate.result }}
        run: test "$RESULT" = success
